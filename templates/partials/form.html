{% if form.non_field_errors %}
  <div class="alert alert-error" role="alert">
    <span aria-hidden="true">⚠</span>
    <div>{% for error in form.non_field_errors %}<div>{{ error }}</div>{% endfor %}</div>
  </div>
{% endif %}
{% for field in form %}
  {% if not hidden_fields or field.name not in hidden_fields %}
    {% include "partials/form_field.html" with field=field %}
  {% endif %}
{% endfor %}
