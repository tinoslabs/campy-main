{% extends "base.html" %}
{% block title %}{{ status }} — {{ title }} · {{ BRAND.name }}{% endblock %}
{% block body %}
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:var(--sp-5)">
  <div class="center" style="max-width:460px">
    {% load static %}
    <img src="{% static BRAND.logo %}" alt="{{ BRAND.name }}" style="height:38px;margin:0 auto var(--sp-6)">
    <div style="font-size:4rem;font-weight:700;letter-spacing:-.04em;color:var(--text-3);line-height:1">{{ status }}</div>
    <h1 style="margin-top:var(--sp-3)">{{ title }}</h1>
    <p class="muted">{{ message }}</p>
    <div class="row" style="justify-content:center;margin-top:var(--sp-5)">
      <a href="/" class="btn">Back to site</a>
      {% if request.user.is_authenticated %}
        <a href="{% url 'dashboard:home' %}" class="btn btn-primary">Go to dashboard</a>
      {% endif %}
    </div>
  </div>
</div>
{% endblock %}
