{% extends "accounts/auth_base.html" %}
{% block title %}Choose a new password · {{ BRAND.name }}{% endblock %}
{% block auth_content %}
<div class="card card-pad">
  <h1 style="font-size:1.4rem">Choose a new password</h1>
  <form method="post" novalidate style="margin-top:var(--sp-4)">
    {% csrf_token %}
    {% include "partials/form.html" %}
    <button type="submit" class="btn btn-primary btn-block">Set new password</button>
  </form>
</div>
{% endblock %}
